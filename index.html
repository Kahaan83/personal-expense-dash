<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C1210" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="referrer" content="no-referrer" />
<title>Ledger</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" sizes="192x192" />
<link rel="icon" href="icon-512.png" sizes="512x512" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0" />

<style>
/* ══════════════════════════════════════════════════════════════
   MATERIAL 3 EXPRESSIVE DESIGN TOKENS
   ══════════════════════════════════════════════════════════════ */
:root {
  --md-sys-color-primary:                  #7CE8B3;
  --md-sys-color-on-primary:               #00391F;
  --md-sys-color-primary-container:        #0E5C38;
  --md-sys-color-on-primary-container:     #B4F5D2;

  --md-sys-color-secondary:                #B7CBBC;
  --md-sys-color-on-secondary:             #21362A;
  --md-sys-color-secondary-container:      rgba(124, 232, 179, 0.14);
  --md-sys-color-on-secondary-container:   #CFEBD8;

  --md-sys-color-tertiary:                 #8FD3E8;
  --md-sys-color-on-tertiary:              #003543;
  --md-sys-color-tertiary-container:       #1B4A57;
  --md-sys-color-on-tertiary-container:    #C7EBF7;

  --md-sys-color-surface:                  #0C1210;
  --md-sys-color-surface-dim:              #090E0C;
  --md-sys-color-surface-container-lowest: #070B09;
  --md-sys-color-surface-container-low:    rgba(150, 190, 170, 0.06);
  --md-sys-color-surface-container:        rgba(160, 200, 180, 0.08);
  --md-sys-color-surface-container-high:   rgba(170, 210, 190, 0.11);
  --md-sys-color-surface-container-highest:rgba(180, 220, 200, 0.15);

  --md-sys-color-on-surface:               #EAF2ED;
  --md-sys-color-on-surface-variant:       #AEC1B7;
  --md-sys-color-outline:                  #7E9389;
  --md-sys-color-outline-variant:          rgba(255,255,255,0.09);

  --md-sys-color-credit:                   #7CE8B3;
  --md-sys-color-credit-container:         rgba(124, 232, 179, 0.16);
  --md-sys-color-on-credit-container:      #B4F5D2;
  --md-sys-color-debit:                    #FFB4AB;
  --md-sys-color-debit-container:          rgba(255, 90, 79, 0.16);
  --md-sys-color-on-debit-container:       #FFDAD6;
  --md-sys-color-warn:                     #F5D167;
  --md-sys-color-warn-container:           rgba(245, 209, 103, 0.16);
  --md-sys-color-on-warn-container:        #FFE088;

  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 24px;
  --r-xl: 28px;
  --r-full: 9999px;

  --cat-Food:#FF8A65; --cat-Transport:#4DD0E1; --cat-Shopping:#BA68C8;
  --cat-Groceries:#81C784; --cat-Household:#FFD54F; --cat-Health:#F06292;
  --cat-Entertainment:#4FC3F7; --cat-Subscriptions:#9575CD; --cat-Transfer:#90A4AE;
  --cat-Investment:#7CE8B3; --cat-Income:#69F0AE; --cat-Vices:#A1887F; --cat-Other:#78909C;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);

  --ease-m3: cubic-bezier(0.2, 0.0, 0, 1.0);

  /* ── Liquid glass system ─────────────────────────────── */
  --glass-blur: 24px;
  --glass-sat: 160%;
  --glass-border: rgba(255,255,255,0.10);
  --glass-sheen: inset 0 1px 0 rgba(255,255,255,0.07), inset 0 0 0 1px rgba(255,255,255,0.03);
  --glass-shadow: 0 8px 30px -12px rgba(0,0,0,0.55);
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

html, body {
  height: 100%;
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

body {
  background-image:
    radial-gradient(65% 38% at 18% 0%, rgba(124,232,179,0.16) 0%, transparent 75%),
    radial-gradient(55% 34% at 88% 8%, rgba(143,211,232,0.10) 0%, transparent 80%),
    radial-gradient(70% 40% at 85% 100%, rgba(14,92,56,0.28) 0%, transparent 85%),
    radial-gradient(50% 30% at 5% 90%, rgba(124,232,179,0.08) 0%, transparent 80%);
  background-attachment: fixed;
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px; border-radius: var(--r-xs); }
.num { font-family: 'DM Mono', monospace; font-feature-settings: 'tnum' 1; }
.material-symbols-rounded { font-size: 22px; vertical-align: middle; line-height: 1; }

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 448px;
  margin: 0 auto;
  position: relative;
  background: var(--md-sys-color-surface);
  border-left: 1px solid rgba(255,255,255,0.04);
  border-right: 1px solid rgba(255,255,255,0.04);
}

.ribbon, .ai, .row, .skel-row, .breakdown, .holding, .set-card, .fold,
.match-row, .confirm, .owed-bar, .sheet, .quick-input-wrap, .search input,
.chip, .toast, .nav, .monthpick, .field input, .field select, .danger-note,
.mgrid button, .parsed, .filters {
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
}

.screen {
  display: none;
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(108px + var(--safe-bot));
  scroll-padding-top: var(--safe-top);
  overscroll-behavior-y: contain;
}
.screen.active { display: block; }

/* ── Top App Bar ─────────────────────────────────────────── */
.topbar {
  padding: calc(20px + var(--safe-top)) 20px 14px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.topbar h1 {
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--md-sys-color-on-surface);
}
.eyebrow {
  font-size: 13px;
  font-weight: 600;
  color: var(--md-sys-color-primary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Month Segmented Button ────────────────────────────── */
.monthpick {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-sheen);
  border-radius: var(--r-full);
  padding: 4px 6px;
}
.monthpick button.nav-arr {
  width: 30px; height: 30px;
  border-radius: var(--r-full);
  display: grid; place-items: center;
  color: var(--md-sys-color-on-surface-variant);
  transition: background 0.2s var(--ease-m3);
}
.monthpick button.nav-arr:hover:not(:disabled) {
  background: var(--md-sys-color-secondary-container);
  color: var(--md-sys-color-on-secondary-container);
}
.monthpick button.nav-arr:disabled { opacity: 0.25; cursor: default; }
.monthpick .label {
  font-size: 13px; font-weight: 600;
  color: var(--md-sys-color-on-surface);
  min-width: 74px; text-align: center;
  padding: 4px 6px;
  border-radius: var(--r-full);
}
.monthpick .label:hover { background: var(--md-sys-color-surface-container-highest); }

/* ── Hero Card ──────────────────────────────── */
.ribbon {
  margin: 10px 18px 18px;
  background: linear-gradient(150deg, var(--md-sys-color-surface-container-high), var(--md-sys-color-surface-container-low));
  border: 1px solid var(--glass-border);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--glass-shadow), var(--glass-sheen);
  position: relative;
}
.ribbon::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
}
.ribbon-head { padding: 24px 24px 2px; display: flex; justify-content: space-between; align-items: flex-start; }
.ribbon-label { font-size: 13px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); letter-spacing: 0.01em; }
.ribbon-amount { font-size: 38px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-top: 6px; }
.ribbon-amount .rs { font-size: 24px; color: var(--md-sys-color-primary); margin-right: 2px; }
.ribbon-delta { font-size: 13px; font-weight: 500; margin-top: 8px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; }
.ribbon-chart { display: block; width: 100%; height: 88px; margin-top: 6px; }
.ribbon-chart path.cum-line {
  fill: none;
  stroke: var(--md-sys-color-primary);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 2px 6px rgba(124,232,179,0.4));
}
.ribbon-chart path.cum-fill {
  fill: url(#spendGradient);
  opacity: 0.35;
  stroke: none;
}
.ribbon-chart .bar { fill: var(--md-sys-color-secondary-container); opacity: 0.75; }
.ribbon-axis {
  display: flex; justify-content: space-between;
  padding: 2px 24px 16px;
  font-size: 11px; font-weight: 500;
  color: var(--md-sys-color-outline);
}

@media (prefers-reduced-motion: no-preference) {
  .ribbon-chart path.cum-line {
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    animation: draw 1.2s var(--ease-m3) forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
}

.stat-rail {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--glass-border);
}
.stat { padding: 16px 18px; border-right: 1px solid var(--glass-border); }
.stat:last-child { border-right: none; }
.stat-k { font-size: 11.5px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); margin-bottom: 5px; letter-spacing: 0.01em; }
.stat-v { font-size: 16px; font-weight: 600; }
.pos { color: var(--md-sys-color-credit); }
.neg { color: var(--md-sys-color-debit); }

/* ── Section Titles ───────────────────────────────────────── */
.sec { display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 12px; }
.sec h2 { font-size: 15px; font-weight: 700; color: var(--md-sys-color-on-surface); letter-spacing: -0.01em; }
.sec button { font-size: 13px; font-weight: 600; color: var(--md-sys-color-primary); display: flex; align-items: center; gap: 4px; }
.sec button:hover { opacity: 0.8; }

/* ── AI Sparkle Card ───────────────────────────────────── */
.ai {
  margin: 8px 18px 16px;
  padding: 18px 20px;
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, rgba(124, 232, 179, 0.14), rgba(143, 211, 232, 0.08));
  border: 1px solid rgba(124, 232, 179, 0.22);
  box-shadow: var(--glass-shadow), var(--glass-sheen);
  position: relative;
  overflow: hidden;
}
.ai::after {
  content: '';
  position: absolute; right: -20px; bottom: -20px;
  width: 100px; height: 100px;
  background: radial-gradient(circle, rgba(124,232,179,0.18) 0%, transparent 70%);
  pointer-events: none;
}
.ai-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.ai-head span { font-size: 13px; font-weight: 700; color: var(--md-sys-color-primary); display: flex; align-items: center; gap: 6px; }
.ai-head button {
  font-size: 12px; font-weight: 600;
  color: var(--md-sys-color-on-surface-variant);
  background: var(--md-sys-color-surface-container);
  padding: 5px 12px;
  border-radius: var(--r-full);
  border: 1px solid var(--glass-border);
}
.ai-head button:hover { background: var(--md-sys-color-surface-container-highest); }
.ai-body { font-size: 13.5px; line-height: 1.65; color: var(--md-sys-color-on-surface); }
.spin { display: inline-block; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ── Quick Add ──────────────────────────────────────── */
.quick { margin: 14px 18px 4px; display: flex; gap: 8px; }
.quick-input-wrap {
  flex: 1; position: relative;
  display: flex; align-items: center;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-sheen);
  border-radius: var(--r-full);
  padding: 0 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.quick-input-wrap:focus-within {
  border-color: var(--md-sys-color-primary);
  box-shadow: 0 0 0 1px var(--md-sys-color-primary);
}
.quick-input-wrap .ai-icon { color: var(--md-sys-color-primary); font-size: 20px; margin-right: 8px; }
.quick-input-wrap input {
  flex: 1; background: none; border: none; outline: none;
  padding: 13px 0;
  color: var(--md-sys-color-on-surface); font-size: 14.5px;
}
.quick-input-wrap input::placeholder { color: var(--md-sys-color-outline); }
.quick-btn {
  padding: 0 20px; border-radius: var(--r-full);
  background: var(--md-sys-color-primary);
  color: var(--md-sys-color-on-primary);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
  transition: transform 0.15s, opacity 0.2s;
  box-shadow: 0 4px 14px -4px rgba(124,232,179,0.5);
}
.quick-btn:active { transform: scale(0.96); }
.quick-btn:disabled { opacity: 0.5; box-shadow: none; }
.quick-note { margin: 8px 24px 0; font-size: 12px; font-weight: 500; color: var(--md-sys-color-outline); min-height: 16px; }

/* ── Transaction Rows ──────────────────────────────────────── */
.rows { padding: 0 18px; }
.daybar {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 18px 8px 8px;
  font-size: 12px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--md-sys-color-primary);
}
.row {
  position: relative;
  display: flex; align-items: center; gap: 14px;
  padding: 13px 14px; margin-bottom: 8px;
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-sheen);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: transform 0.18s var(--ease-m3), background 0.18s;
}
.row.tappable { cursor: pointer; }
.row.tappable:hover { background: var(--md-sys-color-surface-container-high); }
.chip-dot {
  width: 42px; height: 42px; border-radius: 14px;
  display: grid; place-items: center; font-size: 19px; flex: none;
}
.row-mid { flex: 1; min-width: 0; }
.row-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--md-sys-color-on-surface); }
.row-sub { font-size: 12.5px; color: var(--md-sys-color-on-surface-variant); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.row-desc { font-size: 13px; color: var(--md-sys-color-on-surface); opacity: .82; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.row-right { text-align: right; flex: none; }
.row-amt { font-size: 15px; font-weight: 600; }
.row-bal { font-size: 11px; color: var(--md-sys-color-outline); margin-top: 3px; }
.row-acts {
  position: absolute; right: 0; top: 0; bottom: 0;
  display: flex; align-items: center; gap: 6px; padding: 0 12px 0 28px;
  background: linear-gradient(90deg, transparent 0%, var(--md-sys-color-surface-container-highest) 35%);
  transform: translateX(105%);
  transition: transform 0.22s var(--ease-m3);
}
.row.open .row-acts { transform: translateX(0); }
.row-acts button {
  width: 36px; height: 36px; border-radius: var(--r-full);
  display: grid; place-items: center;
  background: var(--md-sys-color-surface-container-highest);
  border: 1px solid var(--glass-border);
  color: var(--md-sys-color-on-surface);
  transition: background 0.15s;
}
.row-acts button:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.row-acts button.del { color: var(--md-sys-color-debit); }
.row-acts button.del:hover { background: var(--md-sys-color-debit-container); color: var(--md-sys-color-on-debit-container); }

@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}
.skel {
  --skel-base: #1B2420;
  --skel-shine: #26332C;
  background: linear-gradient(90deg, var(--skel-base) 25%, var(--skel-shine) 50%, var(--skel-base) 75%);
  background-size: 800px 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: var(--r-xs);
}
.skel-row {
  display: flex; align-items: center; gap: 14px;
  padding: 13px 14px; margin-bottom: 8px;
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-md);
}
.skel-icon {
  width: 42px; height: 42px; border-radius: 14px; flex: none;
}
.skel-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.skel-line { height: 11px; }
.skel-line.w-60 { width: 60%; }
.skel-line.w-40 { width: 40%; }
.skel-line.w-75 { width: 75%; }
.skel-line.w-30 { width: 30%; }
.skel-amt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: none; }
.skel-amt-main { width: 52px; height: 13px; }
.skel-amt-sub  { width: 36px; height: 9px; }
.skel-stat { height: 18px; width: 70%; }
.skel-hero-amt { height: 40px; width: 55%; margin-top: 4px; }

/* ── Spend Breakdown ───────────────────────────────────── */
.breakdown {
  margin: 0 18px;
  padding: 18px;
  background: var(--md-sys-color-surface-container);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-sheen);
  border-radius: var(--r-lg);
}
.stackbar { display: flex; height: 10px; border-radius: var(--r-full); overflow: hidden; gap: 3px; margin-bottom: 18px; }
.stackbar i { display: block; height: 100%; border-radius: var(--r-full); transition: width 0.3s var(--ease-m3); }
.brow { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--glass-border); }
.brow:last-child { border-bottom: none; }
.brow .sw { width: 10px; height: 10px; border-radius: 4px; flex: none; }
.brow .nm { flex: 1; font-size: 14px; font-weight: 500; }
.brow .pc { font-size: 12px; font-weight: 600; color: var(--md-sys-color-on-surface-variant); width: 40px; text-align: right; }
.brow .am { font-size: 14px; font-weight: 600; width: 84px; text-align: right; }

/* ── Filter & Search Bar ───────────────────────────────────── */
.filters {
  position: sticky; top: 0; z-index: 5;
  padding: 10px 18px 14px;
  background: linear-gradient(180deg, var(--md-sys-color-surface) 70%, transparent);
}
.search { position: relative; }
.search input {
  width: 100%;
  background: var(--md-sys-color-surface-container-high);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-sheen);
  border-radius: var(--r-full);
  padding: 12px 16px 12px 42px;
  color: var(--md-sys-color-on-surface); font-size: 14px;
  transition: border-color 0.2s;
}
.search input:focus { border-color: var(--md-sys-color-primary); outline: none; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--md-sys-color-outline); }

.chips-wrap {
  position: relative;
  margin-top: 10px;
}
.chips-wrap::after {
  content: '';
  position: absolute;
  right: 0; top: 0; bottom: 4px;
  width: 48px;
  background: linear-gradient(to right, transparent, var(--md-sys-color-surface) 90%);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.chips-wrap.has-overflow::after {
  opacity: 1;
}
.chips {
  display: flex; gap: 8px;
  overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  font-size: 13px; font-weight:
